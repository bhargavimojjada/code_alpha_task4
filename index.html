<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple rule-based chatbot website.">
  <title>Basic Chatbot</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <div class="bot-avatar" aria-hidden="true">B</div>
      <div>
        <h1>Basic Chatbot</h1>
        <p><span class="status-dot"></span> Ready to chat</p>
      </div>
    </header>

    <section class="conversation" id="conversation" aria-label="Chat messages" aria-live="polite">
      <div class="message bot-message">
        <span class="message-label">Bot</span>
        <p>Hi there! Say hello, ask how I am, or type bye to finish.</p>
      </div>
    </section>

    <form class="chat-form" id="chat-form">
      <label class="sr-only" for="user-input">Your message</label>
      <input id="user-input" name="message" type="text"
             placeholder="Type a message..." autocomplete="off" required>
      <button type="submit" aria-label="Send message">
        Send <span aria-hidden="true">➜</span>
      </button>
    </form>

    <p class="hint">
      Try:
      <button class="suggestion" type="button">hello</button>
      <button class="suggestion" type="button">how are you</button>
      <button class="suggestion" type="button">bye</button>
    </p>
  </main>
</body>
</html>
